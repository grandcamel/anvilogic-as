# Anvilogic SaaS control-plane API-surface registry — Wave 1
# Synthesized 2026-07-06 from four public-source harvests (public docs GitBook,
# anvilogic-forge/armory, Azure-Sentinel Anvilogic solution, SOAR connector pages).
#
# READ THIS FIRST:
# - NO public source shows an actual Anvilogic SaaS REST path or HTTP method.
#   Every entry below is inferred from a documented UI action, a documented
#   connectivity requirement, or a named SOAR connector action. method/path are
#   UNKNOWN everywhere; nothing is invented.
# - ADX-side evidence (POST <avl_adx_uri>/v2/rest/query from the Azure Sentinel
#   connector) is deliberately EXCLUDED from this registry: it is Microsoft's
#   generic Azure Data Explorer query API on the customer's per-tenant cluster,
#   not the Anvilogic SaaS control plane. See domain-model.md for that material.
# - The armory UI deep-link https://secure.anvilogic.com/use_cases?id=AVL_UC####
#   is a browser route, not a REST endpoint; it is recorded in domain-model.md
#   and conventions.md (hosts) only.

version: 1
# base_url is INFERRED: secure.anvilogic.com is the confirmed control-plane host
# (docs connectivity requirements; armory UI deep-links), but the exact REST API
# base path beneath it is unknown in Wave 1.
